<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyFood — Portal de Restaurantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #f4f5f7;
    --card-bg: #ffffff;
    --primary: #ff4757;
    --primary-hover: #e83849;
    --secondary: #2f3542;
    --text-main: #1e272e;
    --text-muted: #747d8c;
    --border: #f1f2f6;
    --success: #2ed573;
    --warning: #ffa502;
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* Header principal */
  header.navbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .nav-container {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--secondary);
    letter-spacing: -0.5px;
  }

  .brand h1 span { color: var(--primary); }

  .session-status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: #f1f2f6;
    border-radius: 30px;
    color: var(--text-muted);
  }

  .status-badge.active {
    background: #e1f9ec;
    color: #20bf6b;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  .status-badge.active .status-dot { background: var(--success); }

  .btn-logout {
    background: transparent;
    border: 1px solid #dcdde1;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    background: #ff475715;
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Grid Layout principal */
  .main-container {
    max-width: 1100px;
    margin: 32px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 32px;
  }

  @media (max-width: 850px) {
    .main-container { grid-template-columns: 1fr; }
  }

  /* Cards e Containers */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Formulários */
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  label:first-of-type { margin-top: 0; }

  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid #dcdde1;
    border-radius: 10px;
    background: #fafafa;
    color: var(--text-main);
    transition: all 0.2s;
  }

  input:focus, textarea:focus {
    outline: none;
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.15);
  }

  .btn-primary {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: var(--primary);
    box-shadow: 0 4px 14px rgba(255, 71, 87, 0.3);
    transition: all 0.2s;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(255, 71, 87, 0.4);
  }

  .btn-secondary {
    background: #f1f2f6;
    color: var(--secondary);
    box-shadow: none;
  }

  .btn-secondary:hover {
    background: #e4e5ea;
    box-shadow: none;
  }

  /* Feedback */
  .feedback {
    margin-top: 14px;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
    font-weight: 600;
  }
  .feedback.show { display: block; }
  .feedback.error { background: #ffe0e3; color: #d63031; }
  .feedback.ok { background: #e1f9ec; color: #20bf6b; }

  /* User profile card */
  .profile-card {
    text-align: center;
    padding: 10px 0;
  }
  .avatar {
    width: 64px;
    height: 64px;
    background: #ffe0e3;
    color: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 12px;
  }
  .user-name { font-weight: 800; font-size: 16px; color: var(--secondary); }
  .user-email { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }

  /* Lista de Restaurantes */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .btn-refresh {
    background: var(--card-bg);
    border: 1px solid #dcdde1;
    padding: 8px 14px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .btn-refresh:hover {
    color: var(--primary);
    border-color: var(--primary);
  }

  .restaurant-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 720px;
    overflow-y: auto;
    padding-right: 6px;
  }

  .restaurant-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  .restaurant-main-info {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .cover-img {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: #f1f2f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .details { flex: 1; }
  .restaurant-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 4px;
  }

  .category-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: #f1f2f6;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 800;
    color: #d97706;
    background: #fef3c7;
    padding: 4px 8px;
    border-radius: 6px;
    margin-left: 6px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .btn-action {
    background: transparent;
    border: 1px solid #dcdde1;
    padding: 6px 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-action.edit:hover { background: #2f3542; color: white; border-color: #2f3542; }
  .btn-action.delete:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-action.dish:hover { background: var(--primary); color: white; border-color: var(--primary); }

  /* Seção de Pratos dentro do Card */
  .dishes-container {
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dish-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafafa;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #f1f2f6;
  }

  .dish-info { display: flex; align-items: center; gap: 10px; }
  .dish-img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: #e4e5ea; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .dish-name { font-weight: 700; font-size: 13px; color: var(--secondary); }
  .dish-desc { font-size: 11px; color: var(--text-muted); }
  .dish-price { font-weight: 700; font-size: 13px; color: var(--success); }

  /* Modal de Cadastro de Prato */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: white;
    padding: 24px;
    border-radius: var(--radius);
    width: 100%;
    max-width: 440px;
    box-shadow: var(--shadow-md);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-title { font-weight: 700; font-size: 16px; color: var(--secondary); }
  .close-modal { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }

  .empty-state, .load-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-logo">🍔</div>
        <h1>Easy<span>Food</span></h1>
      </div>
      <div class="session-status">
        <div class="status-badge" id="sessionBadge">
          <span class="status-dot"></span>
          <span id="sessionLabel">Visitante</span>
        </div>
        <button id="logoutBtn" class="btn-logout" style="display:none" onclick="clearSession()">Sair</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div>
      <div class="card">
        <h2 class="card-title" id="authTitle">🔑 Minha Conta</h2>
        <div id="authLoggedOut">
          <form id="loginForm">
            <label>E-mail</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <button type="submit" class="btn-primary">Entrar</button>
          </form>
          <div class="feedback" id="authFeedback"></div>
        </div>
        <div id="authLoggedIn" style="display:none">
          <div class="profile-card">
            <div class="avatar">👤</div>
            <div class="user-name" id="activeUserName">Igor</div>
            <div class="user-email" id="activeUserEmail">igor.novo@testes.com</div>
            <button class="btn-primary btn-secondary" onclick="clearSession()">Encerrar Sessão</button>
          </div>
        </div>
      </div>

      <div class="card" id="restaurantFormCard">
        <h2 class="card-title" id="formTitle">✨ Cadastrar Restaurante</h2>
        <form id="restaurantForm">
          <input type="hidden" id="rId">
          <label>Nome do Restaurante</label>
          <input type="text" id="rName" required placeholder="Ex: Taco Feliz">
          <label>Categoria</label>
          <input type="text" id="rCategory" placeholder="Ex: Mexicana">
          <label>Nota de Avaliação (0 a 5)</label>
          <input type="number" id="rRating" step="0.1" min="0" max="5" value="4.8">
          <button type="submit" class="btn-primary" id="btnSubmit">Salvar Restaurante</button>
          <button type="button" class="btn-primary btn-secondary" id="btnCancelEdit" style="display:none; margin-top: 8px;">Cancelar Edição</button>
        </form>
        <div class="feedback" id="restaurantFeedback"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="toolbar">
          <h2 class="card-title" style="margin-bottom:0">🍽️ Restaurantes em Destaque</h2>
          <button id="refreshBtn" class="btn-refresh">🔄 Atualizar</button>
        </div>
        <div class="restaurant-grid" id="restaurantList">
          <div class="load-state">Carregando catálogo...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Cadastrar Prato com Imagem -->
  <div class="modal" id="dishModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalRestaurantTitle">Cadastrar Prato</h3>
        <button class="close-modal" onclick="closeDishModal()">✕</button>
      </div>
      <form id="dishForm">
        <input type="hidden" id="modalRestaurantId">
        <label>Nome do Prato</label>
        <input type="text" id="dishName" required placeholder="Ex: Tacos Al Pastor">
        <label>Descrição</label>
        <textarea id="dishDescription" rows="2" required placeholder="Ingredientes e detalhes..."></textarea>
        <label>Preço (R$)</label>
        <input type="number" step="0.01" id="dishPrice" required placeholder="35.90">
        <label>Foto do Prato (Imagem)</label>
        <input type="file" id="dishImage" accept="image/*" required>
        <button type="submit" class="btn-primary" style="margin-top: 16px;">Salvar Prato e Enviar Foto</button>
      </form>
    </div>
  </div>

  <footer>EasyFood — Sistema de Gestão de Restaurantes</footer>

<script>
  const API_BASE = "";
  const tokenKey = "easyfood_token";
  const userKey = "easyfood_user";

  function getToken() { return localStorage.getItem(tokenKey); }
  function getUser() {
    const rawData = localStorage.getItem(userKey);
    if (!rawData) return null;
    try { return JSON.parse(rawData); } catch (e) { return null; }
  }

  function setSession(token, user) {
    localStorage.setItem(tokenKey, token);
    localStorage.setItem(userKey, JSON.stringify(user || { name: "Igor", email: "igor.novo@testes.com" }));
    renderSession();
  }

  function clearSession() {
    localStorage.removeItem(tokenKey);
    localStorage.removeItem(userKey);
    renderSession();
    loadRestaurants();
  }

  function showFeedback(id, msg, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = `feedback show ${type}`;
  }

  function hideFeedback(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = "feedback";
  }

  function getCategoryEmoji(category) {
    const cat = (category || "").toLowerCase();
    if (cat.includes("hamburg") || cat.includes("burger")) return "🍔";
    if (cat.includes("pizza") || cat.includes("italiana") || cat.includes("massa")) return "🍕";
    if (cat.includes("japon") || cat.includes("sushi")) return "🍣";
    if (cat.includes("mexic") || cat.includes("taco")) return "🌮";
    if (cat.includes("brasil")) return "🥩";
    if (cat.includes("portug")) return "🥖";
    return "🍲";
  }

  function renderSession() {
    const token = getToken();
    const user = getUser();
    const badge = document.getElementById("sessionBadge");
    const label = document.getElementById("sessionLabel");
    const logoutBtn = document.getElementById("logoutBtn");
    const restaurantFormCard = document.getElementById("restaurantFormCard");

    if (token) {
      badge.classList.add("active");
      label.textContent = user?.name || "Igor";
      logoutBtn.style.display = "block";
      if (restaurantFormCard) restaurantFormCard.style.display = "block";
      document.getElementById("authLoggedOut").style.display = "none";
      document.getElementById("authLoggedIn").style.display = "block";
      document.getElementById("authTitle").textContent = "👤 Minha Conta";
      document.getElementById("activeUserName").textContent = user?.name || "Igor";
      document.getElementById("activeUserEmail").textContent = user?.email || "igor.novo@testes.com";
    } else {
      badge.classList.remove("active");
      label.textContent = "Visitante";
      logoutBtn.style.display = "none";
      if (restaurantFormCard) restaurantFormCard.style.display = "none";
      document.getElementById("authLoggedOut").style.display = "block";
      document.getElementById("authLoggedIn").style.display = "none";
      document.getElementById("authTitle").textContent = "🔑 Minha Conta";
    }
  }

  async function loadRestaurants() {
    const listEl = document.getElementById("restaurantList");
    listEl.innerHTML = '<div class="load-state">Carregando catálogo...</div>';

    try {
      const res = await fetch(`${API_BASE}/restaurants`);
      const restaurants = await res.json();

      if (!restaurants || restaurants.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Nenhum restaurante cadastrado.</div>';
        return;
      }

      const token = getToken();
      listEl.innerHTML = "";

      for (const r of restaurants) {
        const card = document.createElement("div");
        card.className = "restaurant-card";
        const emoji = getCategoryEmoji(r.category);

        let actionsHtml = `
          <button class="btn-action dish" onclick="openDishModal('${r.id}', '${r.name}')" title="Adicionar Prato">
            ➕ Prato
          </button>
        `;

        if (token) {
          actionsHtml += `
            <button class="btn-action edit" onclick="startEdit('${r.id}', '${r.name}', '${r.category || ''}', '${r.rating || ''}')" title="Editar">✏️</button>
            <button class="btn-action delete" onclick="deleteRestaurant('${r.id}')" title="Excluir">🗑️</button>
          `;
        }

        // Buscar pratos do restaurante
        let dishesHtml = "";
        try {
          const dishRes = await fetch(`${API_BASE}/restaurants/${r.id}/dishes`);
          if (dishRes.ok) {
            const dishes = await dishRes.json();
            if (dishes && dishes.length > 0) {
              dishesHtml = `<div class="dishes-container">`;
              dishes.forEach(d => {
                dishesHtml += `
                  <div class="dish-item">
                    <div class="dish-info">
                      <div class="dish-img">🍲</div>
                      <div>
                        <div class="dish-name">${d.name}</div>
                        <div class="dish-desc">${d.description || ''}</div>
                      </div>
                    </div>
                    <div class="dish-price">R$ ${Number(d.price).toFixed(2)}</div>
                  </div>
                `;
              });
              dishesHtml += `</div>`;
            }
          }
        } catch (e) {}

        card.innerHTML = `
          <div class="restaurant-main-info">
            <div class="cover-img">${emoji}</div>
            <div class="details">
              <div class="restaurant-name">${r.name}</div>
              <div>
                <span class="category-tag">${r.category || 'Geral'}</span>
                <span class="rating-badge">⭐ ${r.rating || '5.0'}</span>
              </div>
            </div>
            <div class="card-actions">${actionsHtml}</div>
          </div>
          ${dishesHtml}
        `;
        listEl.appendChild(card);
      }
    } catch (err) {
      listEl.innerHTML = '<div class="empty-state">Servidor indisponível.</div>';
    }
  }

  // Login Real integrado com /auth/login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideFeedback("authFeedback");

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showFeedback("authFeedback", data.error || "Falha ao fazer login.", "error");
        return;
      }

      setSession(data.token, data.user);
      loadRestaurants();
    } catch (err) {
      showFeedback("authFeedback", "Servidor indisponível.", "error");
    }
  });

  document.getElementById("restaurantForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideFeedback("restaurantFeedback");

    const id = document.getElementById("rId").value;
    const name = document.getElementById("rName").value;
    const category = document.getElementById("rCategory").value;
    const rating = parseFloat(document.getElementById("rRating").value) || 0;

    const isEdit = Boolean(id);
    const url = isEdit ? `${API_BASE}/restaurants/${id}` : `${API_BASE}/restaurants`;
    const method = isEdit ? "PUT" : "POST";

    try {
      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, category, rating })
      });
      const data = await res.json();

      if (!res.ok) {
        showFeedback("restaurantFeedback", data.error || "Falha na operação.", "error");
        return;
      }

      showFeedback("restaurantFeedback", isEdit ? "Alteração salva com sucesso!" : "Restaurante cadastrado com sucesso!", "ok");
      cancelEdit();
      loadRestaurants();
    } catch (err) {
      showFeedback("restaurantFeedback", "Servidor indisponível.", "error");
    }
  });

  function startEdit(id, name, category, rating) {
    document.getElementById("rId").value = id;
    document.getElementById("rName").value = name;
    document.getElementById("rCategory").value = category;
    document.getElementById("rRating").value = rating;
    document.getElementById("formTitle").textContent = "✏️ Editar Restaurante #" + String(id).padStart(3, "0");
    document.getElementById("btnSubmit").textContent = "Salvar Alterações";
    document.getElementById("btnCancelEdit").style.display = "block";
  }

  function cancelEdit() {
    document.getElementById("rId").value = "";
    document.getElementById("restaurantForm").reset();
    document.getElementById("rRating").value = "4.8";
    document.getElementById("formTitle").textContent = "✨ Cadastrar Restaurante";
    document.getElementById("btnSubmit").textContent = "Salvar Restaurante";
    document.getElementById("btnCancelEdit").style.display = "none";
  }

  document.getElementById("btnCancelEdit").addEventListener("click", cancelEdit);

  async function deleteRestaurant(id) {
    if (!confirm(`Deseja realmente remover o restaurante #${id}?`)) return;
    try {
      const res = await fetch(`${API_BASE}/restaurants/${id}`, { method: "DELETE" });
      if (!res.ok) {
        const data = await res.json();
        alert("Erro ao excluir: " + (data.error || "Não autorizado"));
        return;
      }
      loadRestaurants();
    } catch (err) {
      alert("Erro ao conectar com o servidor.");
    }
  }

  function openDishModal(id, name) {
    document.getElementById("modalRestaurantId").value = id;
    document.getElementById("modalRestaurantTitle").textContent = `Cadastrar Prato — ${name}`;
    document.getElementById("dishForm").reset();
    document.getElementById("dishModal").classList.add("active");
  }

  function closeDishModal() {
    document.getElementById("dishModal").classList.remove("active");
  }

  document.getElementById("dishForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const restaurantId = document.getElementById("modalRestaurantId").value;
    
    const formData = new FormData();
    formData.append("name", document.getElementById("dishName").value);
    formData.append("description", document.getElementById("dishDescription").value);
    formData.append("price", document.getElementById("dishPrice").value);
    
    const imageFile = document.getElementById("dishImage").files[0];
    if (imageFile) {
      formData.append("image", imageFile);
    }

    try {
      const res = await fetch(`${API_BASE}/restaurants/${restaurantId}/dishes`, {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      if (!res.ok) {
        alert("Erro ao cadastrar prato: " + (data.error || "Falha na requisição"));
        return;
      }

      alert("Prato cadastrado com sucesso!");
      closeDishModal();
      loadRestaurants();
    } catch (err) {
      alert("Erro ao conectar com o servidor.");
    }
  });

  // Inicialização correta ao carregar o DOM
  document.addEventListener("DOMContentLoaded", () => {
    renderSession();
    loadRestaurants();
  });

  document.getElementById("refreshBtn").addEventListener("click", loadRestaurants);
</script>

</body>
</html>
